name: Feature idea
description: Suggest something aka could do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or the workflow, rather than the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could aka help?
      description: What you'd type and what you'd expect to happen.
  - type: dropdown
    id: shells
    attributes:
      label: Which shells does this matter for?
      multiple: true
      options: [bash, zsh, fish, PowerShell, All of them]
